name: Build and Deploy Website

on:
  repository_dispatch:
    types: [datawrangling-updated]
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semester tag for snapshot release (e.g., spring-2025). Leave empty for a regular build.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      DATAWRANGLING_SHA: ${{ github.event.client_payload.sha || github.sha }}
      SEMESTER: ${{ github.event.client_payload.semester || github.event.inputs.semester }}

    steps:
      - name: Checkout DataWranglingWebsite
        uses: actions/checkout@v4

      - name: Checkout DataWrangling
        uses: actions/checkout@v4
        with:
          repository: bleds22e/DataWrangling
          token: ${{ secrets.DATAWRANGLING_PAT }}
          path: datawrangling

      - name: Copy course files from DataWrangling
        run: |
          # Copy only the .qmd files needed for the website
          find datawrangling/Week*/ \( \
            -name "*_Instructor.qmd" \
            -o -name "*_Assignment.qmd" \
            -o -name "*_Assignment_AnswerKey.qmd" \
            -o -name "*_Assignment_key.qmd" \
            -o -name "filepaths.qmd" \
            -o -name "Week10_VersionControl.qmd" \
          \) | while IFS= read -r f; do
            rel="${f#datawrangling/}"
            mkdir -p "$(dirname "$rel")"
            cp "$f" "$rel"
          done
          # Copy all data and image assets
          find datawrangling/Week*/ \( \
            -name "*.csv" -o -name "*.txt" \
            -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \
            -o -name "*.tif" -o -name "*.tiff" \
            -o -name "*.shp" -o -name "*.dbf" -o -name "*.prj" -o -name "*.shx" \
            -o -name "*.R" \
          \) | while IFS= read -r f; do
            rel="${f#datawrangling/}"
            mkdir -p "$(dirname "$rel")"
            cp "$f" "$rel"
          done
          cp -r datawrangling/PeerCodeReview . 2>/dev/null || true
          rm -rf datawrangling

      - name: Patch qmd files (strip format, add eval:false to assignments)
        run: |
          python3 - <<'PYEOF'
          import re, glob

          yaml_pattern = re.compile(r'^(---\n)(.*?)(---)', re.DOTALL)

          # Strip 'format:' from all qmd files so they inherit HTML from _quarto.yml
          for path in glob.glob('**/*.qmd', recursive=True):
              if path == 'index.qmd':
                  continue
              text = open(path).read()
              def strip_format(m):
                  header = re.sub(r'^format:.*\n', '', m.group(2), flags=re.MULTILINE)
                  return m.group(1) + header + m.group(3)
              patched = yaml_pattern.sub(strip_format, text, count=1)
              if patched != text:
                  open(path, 'w').write(patched)
                  print(f'Stripped format: {path}')

          # Add eval:false to assignment scaffold files
          for path in glob.glob('**/Week*_Assignment.qmd', recursive=True):
              if 'AnswerKey' in path or '_key' in path:
                  continue
              text = open(path).read()
              def inject(m):
                  header = m.group(2)
                  if 'eval: false' in header:
                      return m.group(0)
                  return m.group(1) + header + 'execute:\n  eval: false\n' + m.group(3)
              patched = yaml_pattern.sub(inject, text, count=1)
              if patched != text:
                  open(path, 'w').write(patched)
                  print(f'Patched eval:false: {path}')
          PYEOF

      - name: Install libcurl system dependency
        run: sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-v5
          restore-keys: r-pkgs-

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
          Rscript -e 'pak::pak(c(
            "tidyverse", "terra", "lterdatasampler", "portalr",
            "palmerpenguins", "usethis", "knitr", "rmarkdown"
          ))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render --to html

      - name: Ensure .nojekyll present
        run: touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Clone gh-pages (or create orphan branch if first deploy)
          git clone --depth 1 --branch gh-pages "$REPO_URL" /tmp/gh-pages 2>/dev/null || {
            mkdir /tmp/gh-pages && cd /tmp/gh-pages
            git init && git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
            cd -
          }

          # Preserve versions.json and any semester subfolders
          mkdir -p /tmp/preserve
          if [ -f /tmp/gh-pages/versions.json ]; then
            cp /tmp/gh-pages/versions.json /tmp/preserve/versions.json
          else
            echo '[]' > /tmp/preserve/versions.json
          fi
          for dir in /tmp/gh-pages/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            echo "$name" | grep -qE '^(spring|fall|summer)-[0-9]{4}$' && cp -r "$dir" /tmp/preserve/
          done

          # Replace root content with the new build
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r _site/. /tmp/gh-pages/

          # Restore preserved content
          cp -r /tmp/preserve/. /tmp/gh-pages/

          # If this is a semester release, also deploy to the subfolder
          if [ -n "$SEMESTER" ]; then
            mkdir -p /tmp/gh-pages/$SEMESTER
            cp -r _site/. /tmp/gh-pages/$SEMESTER/
            python3 << 'PYEOF'
import json, os
path = '/tmp/gh-pages/versions.json'
semester = os.environ['SEMESTER']
versions = json.load(open(path))
if semester not in versions:
    versions.insert(0, semester)
json.dump(versions, open(path, 'w'))
PYEOF
          fi

          # Commit and push
          cd /tmp/gh-pages
          git add -A
          git diff --cached --quiet || git commit -m "Deploy [${GITHUB_SHA::8}]${SEMESTER:+ | semester: $SEMESTER}"
          git push origin gh-pages

      - name: Create semester release
        if: ${{ env.SEMESTER != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SEMESTER }}
          name: ${{ env.SEMESTER }}
          body: |
            Website snapshot for **${{ env.SEMESTER }}**.

            Built from DataWrangling commit: `${{ env.DATAWRANGLING_SHA }}`

            View the live site: https://bleds22e.github.io/DataWranglingWebsite/${{ env.SEMESTER }}/
